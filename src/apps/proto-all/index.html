<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>proto-all — layers panel</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 16px;
        display: flex;
        gap: 16px;
        height: calc(100vh - 32px);
        box-sizing: border-box;
      }

      h1 {
        font-size: 15px;
        margin: 0 0 12px;
      }

      #sidebar {
        width: 280px;
        flex: none;
        display: flex;
        flex-direction: column;
      }

      #layers-card {
        flex: 1;
        min-height: 0;
        --ui-card-body-max-height: none;
      }

      #main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      #toolbar {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      #toolbar h1 {
        margin: 0;
        margin-inline-end: auto;
      }

      #map {
        position: relative;
        flex: 1;
        min-height: 0;
        border-radius: 8px;
        background: repeating-linear-gradient(
          45deg,
          color-mix(in srgb, currentColor 6%, transparent),
          color-mix(in srgb, currentColor 6%, transparent) 10px,
          color-mix(in srgb, currentColor 3%, transparent) 10px,
          color-mix(in srgb, currentColor 3%, transparent) 20px
        );
        border: 1px solid color-mix(in srgb, currentColor 20%, transparent);
        cursor: crosshair;
      }

      #map::before {
        content: 'Pan / Select / Measure is a toggle tool group — click a tool, then click the map to drop a feature popup.';
        position: absolute;
        bottom: 10px;
        left: 12px;
        right: 12px;
        font-size: 12px;
        color: color-mix(in srgb, currentColor 65%, transparent);
      }

      /* Floating corner tool rails — positioned relative to #map, 1em inset from its edges. */
      .corner-tools {
        position: absolute;
        top: 1em;
        border-radius: 6px;
        box-shadow: 0 1px 3px color-mix(in srgb, currentColor 12%, transparent);
      }

      .corner-tools--left {
        left: 1em;
      }

      .corner-tools--right {
        right: 1em;
      }

      .layer-extras {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-inline-start: 8px;
      }

      .layer-extras input[type='range'] {
        width: 60px;
      }

      .feature-coords {
        display: block;
        font-family: ui-monospace, monospace;
        font-size: 12px;
        color: color-mix(in srgb, currentColor 65%, transparent);
        margin-block-start: 4px;
      }
    </style>
  </head>
  <body>
    <aside id="sidebar">
      <h1>Layers</h1>
      <ui-card id="layers-card">
        <widget-nested-list data-region="default" id="layers-list"></widget-nested-list>
        <ui-button data-region="footer" label="Reset" icon="fa-solid fa-rotate-left"></ui-button>
        <ui-button data-region="footer" label="Refresh" icon="fa-solid fa-rotate"></ui-button>
      </ui-card>
    </aside>

    <main id="main">
      <div id="toolbar">
        <h1>Map</h1>
        <widget-button-group id="tools" aria-label="Map tool">
          <ui-button icon="fa-solid fa-hand" label="Pan" value="pan" pressed></ui-button>
          <ui-button icon="fa-solid fa-arrow-pointer" label="Select" value="select"></ui-button>
          <ui-button icon="fa-solid fa-ruler" label="Measure" value="measure"></ui-button>
        </widget-button-group>
      </div>

      <div id="map">
        <widget-button-group id="left-tools" class="corner-tools corner-tools--left" orientation="vertical" aria-label="Left panels">
          <ui-button icon="fa-solid fa-layer-group" aria-label="Layers panel" value="left-1"></ui-button>
          <ui-button icon="fa-solid fa-filter" aria-label="Filter panel" value="left-2"></ui-button>
          <ui-button icon="fa-solid fa-palette" aria-label="Style panel" value="left-3"></ui-button>
          <ui-button icon="fa-solid fa-gear" aria-label="Settings panel" value="left-4"></ui-button>
        </widget-button-group>

        <widget-button-group id="right-tools" class="corner-tools corner-tools--right" orientation="vertical" aria-label="Right panels">
          <ui-button icon="fa-solid fa-compass" aria-label="Legend panel" value="right-1"></ui-button>
          <ui-button icon="fa-solid fa-chart-simple" aria-label="Stats panel" value="right-2"></ui-button>
          <ui-button icon="fa-solid fa-clock-rotate-left" aria-label="History panel" value="right-3"></ui-button>
          <ui-button icon="fa-solid fa-circle-info" aria-label="Info panel" value="right-4"></ui-button>
        </widget-button-group>
      </div>
    </main>

    <widget-floating-panel id="feature-popover">
      <span data-region="header">Feature</span>
      <span data-region="default"></span>
      <ui-button data-region="footer" label="Zoom to" icon="fa-solid fa-magnifying-glass-plus"></ui-button>
    </widget-floating-panel>

    <!-- Left-corner panels: opened from left-tools, one at a time (shared "group" auto-closes siblings). -->
    <widget-floating-panel id="popover-left-1" group="left-tools" data-value="left-1">
      <span data-region="header">Layers</span>
      Layers panel content.
    </widget-floating-panel>
    <widget-floating-panel id="popover-left-2" group="left-tools" data-value="left-2">
      <span data-region="header">Filter</span>
      Filter panel content.
    </widget-floating-panel>
    <widget-floating-panel id="popover-left-3" group="left-tools" data-value="left-3">
      <span data-region="header">Style</span>
      Style panel content.
    </widget-floating-panel>
    <widget-floating-panel id="popover-left-4" group="left-tools" data-value="left-4">
      <span data-region="header">Settings</span>
      Settings panel content.
    </widget-floating-panel>

    <!-- Right-corner panels: same pattern, own group so it never interferes with the left rail. -->
    <widget-floating-panel id="popover-right-1" group="right-tools" data-value="right-1">
      <span data-region="header">Legend</span>
      Legend panel content.
    </widget-floating-panel>
    <widget-floating-panel id="popover-right-2" group="right-tools" data-value="right-2">
      <span data-region="header">Stats</span>
      Stats panel content.
    </widget-floating-panel>
    <widget-floating-panel id="popover-right-3" group="right-tools" data-value="right-3">
      <span data-region="header">History</span>
      History panel content.
    </widget-floating-panel>
    <widget-floating-panel id="popover-right-4" group="right-tools" data-value="right-4">
      <span data-region="header">Info</span>
      Info panel content.
    </widget-floating-panel>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
