<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ui-button demo</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        padding: 24px;
      }
      section {
        margin-bottom: 24px;
      }
      h2 {
        font-size: 14px;
        margin-bottom: 8px;
      }
    </style>
  </head>
  <body>
    <section>
      <h2>Label only</h2>
      <ui-button label="Save"></ui-button>
    </section>

    <section>
      <h2>Icon only (aria-label)</h2>
      <ui-button icon="fa-solid fa-star" aria-label="Favourite"></ui-button>
    </section>

    <section>
      <h2>Label + icon</h2>
      <ui-button label="Save" icon="fa-solid fa-floppy-disk"></ui-button>
    </section>

    <section>
      <h2>Disabled</h2>
      <ui-button label="Save" disabled></ui-button>
    </section>

    <section>
      <h2>Icon position — start (default)</h2>
      <ui-button label="Save" icon="fa-solid fa-star" icon-position="start"></ui-button>
    </section>

    <section>
      <h2>Icon position — end</h2>
      <ui-button label="Save" icon="fa-solid fa-star" icon-position="end"></ui-button>
    </section>

    <section>
      <h2>Programmatic label change (2s)</h2>
      <ui-button id="label-timer-demo" icon="fa-solid fa-spinner" label="Loading"></ui-button>
    </section>

    <section>
      <h2>type="submit" inside a form</h2>
      <form id="demo-form">
        <ui-button type="submit" label="Submit"></ui-button>
        <p id="form-status"></p>
      </form>
    </section>

    <script type="module" src="/src/ui-button.ts"></script>
  </body>
</html>
